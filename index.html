<doctype html>
  <html>
<head>
  <meta charset="utf-8>
    <title></title>
</head>
    <body>
    <div>
    <p id="a1"></p>
    </div>
<form>
    Zeilen: <input type="number" name="zeilen" id="zeilen" min="1"><br>
    Spalten: <input type="number" name="spalten" id="spalten" min="1"><br><br>
  
    <input type="button" value="Erstellen" style="width:200px;" onclick="erzeugen()"/><br><br>
</form>


<div id="tabellen-container"></div>

  <script>
function erzeugen() {
   
    let a = parseInt(document.getElementById("zeilen").value);
    let b = parseInt(document.getElementById("spalten").value);
    let container = document.getElementById("tabellen-container");

    /*if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
        alert("Bitte gib gültige Zahlen größer als 0 ein.");
        return;
    }*/

    let html = "<table border='1' style='border-collapse: collapse;'>";

    for (let i = 1; i <= a; i++) {
        html += "<tr>";
        
        for (let j = 1; j <= b; j++) {
            html += "<td style='padding: 8px;'>Zeile " + i + ", Spalte " + j + "</td>";
        }
        
        html += "</tr>";
    }

    html += "</table>";

    container.innerHTML = html;
}
</script>
    
    </body>
  </html>
